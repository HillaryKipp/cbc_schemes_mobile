name: cbc_schemes_mobile
description: "CBC Schemes of Work - Professional Lesson Planning & Scheme Generator for Kenyan CBC Teachers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  printing: ^5.13.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  archive: ^3.6.1
  xml: ^6.5.0
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

